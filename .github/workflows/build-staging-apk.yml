name: Build staging APK (manual)

# Hand-run only. No push, pull_request, schedule, workflow_run, or caller triggers.
# Spends one EAS build on the existing `preview` profile. See docs/WORKFLOW.md.
on:
  workflow_dispatch:
    inputs:
      prebuild_gate_confirmed:
        description: Confirm all five preview gate checks are green and the release owner authorized this build
        required: true
        type: boolean
        default: false
      gate_evidence_url:
        description: Optional HTTPS URL of the approved gate evidence, recorded in provenance
        required: false
        type: string
      gate_mobile_sha:
        description: Optional override - full SHA asserted to be the current staging tip (the run fails if it is not)
        required: false
        type: string
      paired_api_sha:
        description: Optional override - full deployed Laravel API SHA (replaces the latest staging-state record)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: porsca-staging-apk
  cancel-in-progress: false

env:
  EAS_CLI_VERSION: 27.2.0

jobs:
  build:
    name: Build preview APK from staging
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate gate inputs
        env:
          GATE_MOBILE_SHA: ${{ inputs.gate_mobile_sha }}
          PAIRED_API_SHA: ${{ inputs.paired_api_sha }}
          GATE_EVIDENCE_URL: ${{ inputs.gate_evidence_url }}
          GATE_CONFIRMED: ${{ inputs.prebuild_gate_confirmed }}
        run: |
          set -euo pipefail
          [ "$GATE_CONFIRMED" = "true" ] || { echo "::error::prebuild_gate_confirmed must be true"; exit 1; }
          if [ -n "$GATE_MOBILE_SHA" ]; then
            [[ "$GATE_MOBILE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::gate_mobile_sha must be a full lowercase 40-char SHA"; exit 1; }
          fi
          if [ -n "$PAIRED_API_SHA" ]; then
            [[ "$PAIRED_API_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::paired_api_sha must be a full lowercase 40-char SHA"; exit 1; }
          fi
          if [ -n "$GATE_EVIDENCE_URL" ]; then
            [[ "$GATE_EVIDENCE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "::error::gate_evidence_url must be an https URL"; exit 1; }
          fi

      - name: Check out latest staging
        uses: actions/checkout@v5
        with:
          ref: staging
          persist-credentials: false
          submodules: false

      - name: Freeze staging tip
        id: source
        env:
          GATE_MOBILE_SHA: ${{ inputs.gate_mobile_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "resolved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "$GATE_MOBILE_SHA" ] && [ "$sha" != "$GATE_MOBILE_SHA" ]; then
            echo "::error::staging tip $sha does not match gate_mobile_sha $GATE_MOBILE_SHA; dispatch again"
            exit 1
          fi

      - name: Find green Mobile CI run for exact SHA
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-ci.yml/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.updated_at) | last | .html_url // empty')"
          [ -n "$url" ] || { echo "::error::no successful Mobile CI run for $SOURCE_SHA; no build submitted"; exit 1; }
          echo "run_url=$url" >> "$GITHUB_OUTPUT"

      - name: Resolve paired API commit
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRED_API_SHA: ${{ inputs.paired_api_sha }}
        run: |
          set -euo pipefail
          if [ -n "$PAIRED_API_SHA" ]; then
            echo "sha=$PAIRED_API_SHA" >> "$GITHUB_OUTPUT"
            echo "source=override" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-state.yml/runs?branch=staging&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.html_url)"')"
          [ -n "$run" ] || { echo "::error::no successful Staging state run and no paired_api_sha override; no build submitted"; exit 1; }
          run_id="${run%% *}"
          art="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '[.artifacts[] | select(.name == "staging-state" and (.expired | not))][0].id // empty')"
          [ -n "$art" ] || { echo "::error::latest Staging state run $run_id has no staging-state record and no paired_api_sha override; no build submitted"; exit 1; }
          mkdir -p "$RUNNER_TEMP/staging-state"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art}/zip" > "$RUNNER_TEMP/staging-state.zip"
          unzip -o -q "$RUNNER_TEMP/staging-state.zip" -d "$RUNNER_TEMP/staging-state"
          sha="$(jq -r '.api_commit // empty' "$RUNNER_TEMP/staging-state/staging-state.json")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::staging-state record has no full API commit ('$sha') and no paired_api_sha override; no build submitted"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source=staging-state" >> "$GITHUB_OUTPUT"
          echo "record_url=${run#* }" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical mobile verification
        run: npm run verify

      - name: Validate preview configuration
        run: |
          set -euo pipefail
          node -e '
            const eas = require("./eas.json").build.preview;
            const app = require("./app.json").expo;
            const fail = (m) => { console.error("::error::" + m); process.exit(1); };
            if (eas.channel !== "preview") fail("preview channel changed");
            if (eas.distribution !== "internal") fail("preview distribution changed");
            if (eas.env.EXPO_PUBLIC_APP_ENV !== "staging") fail("preview app env changed");
            if (eas.env.EXPO_PUBLIC_API_URL !== "https://staging-api.porsca.online/api/v1") fail("preview API origin changed");
            if (app.android.package !== "com.porsca.pos") fail("android package changed");
            if (app.extra.eas.projectId !== "27ef9713-4c08-4815-bf6c-48368dd2b260") fail("EAS project changed");
          '

      - name: Set up EAS CLI
        run: npm install --global "eas-cli@${EAS_CLI_VERSION}"

      - name: Re-check staging tip before spending quota
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$EXPO_TOKEN" ] || { echo "::error::EXPO_TOKEN secret is not available"; exit 1; }
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/branches/staging" --jq .commit.sha)"
          [ "$tip" = "$SOURCE_SHA" ] || { echo "::error::staging advanced to $tip during preflight; dispatch again with refreshed gate evidence"; exit 1; }
          eas whoami

      - name: Submit one EAS preview build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json \
            > "$RUNNER_TEMP/eas-build.json" 2> "$RUNNER_TEMP/eas-build.err" || {
              cat "$RUNNER_TEMP/eas-build.err" >&2
              cat "$RUNNER_TEMP/eas-build.json" >&2 || true
              echo "::error::EAS build did not finish; look up the build by ID in the output above before dispatching again. Do not auto-retry."
              exit 1
            }
          node -e '
            const b = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/eas-build.json", "utf8"));
            const build = Array.isArray(b) ? b[0] : b;
            if (!build || build.status !== "FINISHED" || build.platform !== "ANDROID") { console.error("::error::build not a finished Android build"); process.exit(1); }
            const out = [
              "build_id=" + build.id,
              "build_url=https://expo.dev/accounts/porscapos/projects/porsca-app/builds/" + build.id,
              "apk_url=" + build.artifacts.buildUrl,
              "version=" + (build.appVersion || ""),
              "version_code=" + (build.appBuildVersion || ""),
              "profile=" + (build.buildProfile || ""),
              "channel=" + (build.channel || ""),
            ];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '

      - name: Download APK and write provenance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RESOLVED_AT: ${{ steps.source.outputs.resolved_at }}
          BUILD_ID: ${{ steps.eas.outputs.build_id }}
          BUILD_URL: ${{ steps.eas.outputs.build_url }}
          APK_URL: ${{ steps.eas.outputs.apk_url }}
          APP_VERSION: ${{ steps.eas.outputs.version }}
          VERSION_CODE: ${{ steps.eas.outputs.version_code }}
          PROFILE: ${{ steps.eas.outputs.profile }}
          CHANNEL: ${{ steps.eas.outputs.channel }}
          PAIRED_API_SHA: ${{ steps.api.outputs.sha }}
          API_SOURCE: ${{ steps.api.outputs.source }}
          STATE_RECORD_URL: ${{ steps.api.outputs.record_url }}
          CI_RUN_URL: ${{ steps.ci.outputs.run_url }}
          GATE_EVIDENCE_URL: ${{ inputs.gate_evidence_url }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:7}"
          dir="$RUNNER_TEMP/apk-out"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --proto '=https' --max-time 900 "$APK_URL" -o "$dir/porsca-staging-$short.apk"
          unzip -l "$dir/porsca-staging-$short.apk" | grep -q AndroidManifest.xml || { echo "::error::downloaded file is not an APK"; exit 1; }
          sum="$(sha256sum "$dir/porsca-staging-$short.apk" | cut -d' ' -f1)"
          node -e '
            const e = process.env;
            const p = {
              mobile_sha: e.SOURCE_SHA, source_resolved_at: e.RESOLVED_AT,
              paired_api_sha: e.PAIRED_API_SHA, paired_api_source: e.API_SOURCE,
              mobile_ci_run_url: e.CI_RUN_URL, staging_state_record_url: e.STATE_RECORD_URL || null,
              gate_evidence_url: e.GATE_EVIDENCE_URL || null,
              eas_build_id: e.BUILD_ID, eas_build_url: e.BUILD_URL,
              profile: e.PROFILE, channel: e.CHANNEL,
              api_origin: "https://staging-api.porsca.online/api/v1",
              app_version: e.APP_VERSION, version_code: e.VERSION_CODE,
              apk_sha256: process.argv[1],
              dispatch_ref: e.GITHUB_REF, dispatch_sha: e.GITHUB_SHA, actor: e.ACTOR,
              run_url: e.GITHUB_SERVER_URL + "/" + e.GITHUB_REPOSITORY + "/actions/runs/" + e.GITHUB_RUN_ID,
            };
            require("fs").writeFileSync(e.RUNNER_TEMP + "/apk-out/provenance.json", JSON.stringify(p, null, 2) + "\n");
          ' "$sum"
          echo "artifact_name=porsca-staging-apk-$short-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          {
            echo "### Staging APK"
            echo "- Mobile SHA: \`$SOURCE_SHA\`"
            echo "- Paired API SHA: \`$PAIRED_API_SHA\` ($API_SOURCE)"
            echo "- Mobile CI run: $CI_RUN_URL"
            echo "- EAS build: $BUILD_URL"
            echo "- APK SHA-256: \`$sum\`"
            echo "- Artifact retention: 30 days. Artifact creation is not QA approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ runner.temp }}/apk-out/
          if-no-files-found: error
          retention-days: 30
