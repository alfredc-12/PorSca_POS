
ignore_patterns:
  - "graphify-out/**"

pr:
  base_branch: development

protected_paths:
  - ".no-mistakes.yaml"
  - "eas.json"
  - "app.json"
  - ".github/workflows/**"

review:
  conversation: false
  path_instructions:
    - path: "src/domain/**"
      instructions: "Check centavo math, checkout transitions, retry safety, and stock invariants."
    - path: "src/api/**"
      instructions: "Preserve docs/API-CONTRACT.md; only Laravel may confirm payment or sale completion."
    - path: "src/auth/**"
      instructions: "Check secure token storage, current-session 401 handling, and logout isolation."
    - path: "app/checkout.tsx"
      instructions: "Keep tender locks, uncertain-payment recovery, and duplicate-submit protection clear to the cashier."
commands:
  test: "npm run test:fast -- --runTestsByPath src/domain/checkoutMachine.test.ts --passWithNoTests=false"

test:
  instructions: |
    Read AGENTS.md and PROJECT_CHECKS.md; check the selected docs/API-CONTRACT.md header before any API probe.
    Follow docs/SETUP.md; start Expo Web on a free localhost port and pair only an isolated local API with disposable data.
    Use chrome-devtools-axi, a unique CHROME_DEVTOOLS_AXI_SESSION, and default isolated Chrome to drive changed cashier flows.
    Inspect UI and HTTP outcomes; keep practice QR non-payable and follow PROJECT_CHECKS.md safety and proof rules.
    Report defects as no-go and unsupported/native-only checks as inconclusive with manual steps; stop only run-owned resources.
